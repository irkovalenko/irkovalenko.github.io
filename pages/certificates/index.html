<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script type="module" src="../../../js/loadHeader.js"></script>
        <title>Certificates</title>

        <link rel="stylesheet" href="../../../styles.css" />
    </head>

    <body>
        <div id="header"></div>
        <main>
            <div class="section">
                <div class="container">
                    <div class="section-heading">
                        <h2>Courses & <span>Certificates</span></h2>
                    </div>

                    <div class="course-grid"></div>
                </div>
            </div>
        </main>
        <script type="module">
            import { createCourseCard } from '../../../js/components/courseCard.js';
            import { courses } from '../../../js/data/courses.js';

            const courseGrid = document.querySelector('.course-grid');

            courseGrid.innerHTML = courses.map(createCourseCard).join('');
        </script>
    </body>
</html>

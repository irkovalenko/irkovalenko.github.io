<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://unpkg.com/lucide@latest"></script>
        <script type="module" src="../../../js/loadHeader.js"></script>
        <script type="module" src="../../../js/loadFooter.js"></script>
        <script type="module" src="../../../js/loadAbout.js"></script
        <title>About</title>

        <link rel="stylesheet" href="../../../styles.css" />
    </head>

    <body>
        <main>
            <div id="header"></div>
            <div id="about"></div>
            <div class="education-section"></div>
        </main>
        <script type="module">
            import { createEducationTimeLine } from '../../../js/components/educationTimeLine.js';
            import { studies } from '../../../js/data/studies.js';

            const educationLine = document.querySelector('.education-section');
            educationLine.innerHTML = `
                <section id="study" class="section study-section">
                    <div class="container">
                        <div class="section-title">
                            <i data-lucide="graduation-cap"></i>
                            <p class="eyebrow">study</p>
                        </div>
                        <div class="study-list">
                            ${studies.map(createEducationTimeLine).join('')}
                        </div>
                    </div>
                </section>
            `;

            lucide.createIcons();
        </script>
        <div id="footer"></div>
    </body>
</html>
